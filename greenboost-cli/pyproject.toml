[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "greenboost-cli"
version = "1.0.0"
description = "GreenBoost CLI — AI coding assistant powered by gb-synapse (GreenBoost's local, cluster-distributed inference layer)"
requires-python = ">=3.11"
license = { text = "AGPL-3.0" }
authors = [{ name = "Ferran Duarri", email = "ferran@turingprojects.com" }]

dependencies = [
    "openai>=1.30.0",
    "httpx>=0.27.0",
    "rich>=13.0.0",
    "pyyaml>=6.0",
    "numpy>=1.26.0",
    "scrapling[fetchers]>=0.4.8",
    "prompt_toolkit>=3.0",
]

[project.optional-dependencies]
rag       = ["sentence-transformers>=3.0", "torch>=2.3", "rank_bm25>=0.2.2"]
diffusion = ["torch>=2.3", "diffusers>=0.30", "transformers>=4.44",
             "accelerate>=0.33", "torchao>=0.5", "bitsandbytes>=0.43"]
pdf       = ["pymupdf>=1.24"]
opencv    = ["opencv-python>=4.10"]
convert   = ["markitdown[all]>=0.1.0"]
mcp       = ["mcp>=1.0.0"]
full      = ["greenboost-cli[rag,diffusion,pdf,opencv,convert,mcp]"]
dev       = ["pytest>=8.0", "mypy>=1.10", "ruff>=0.5.0"]

[project.scripts]
greenboost-cli = "greenboost_cli.__main__:main"
gb             = "greenboost_cli.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["greenboost_cli"]
# Explicit, VCS-independent file selection. Without this, hatchling falls
# back to the enclosing git repo's ignore rules when this project has no
# .git of its own (true once vendored under greenboost/greenboost-cli/) ,
# and greenboost's own .gitignore has bare `memory/` and `workflow/`
# patterns (for ITS OWN Claude session-memory / workflow-docs folders) that
# match ANY directory with those names at ANY depth, silently dropping this
# package's greenboost_cli/memory/ and greenboost_cli/workflow/ subpackages
# from the wheel with no build error , confirmed 2026-07-13, broke `gb -p`
# with ModuleNotFoundError: No module named 'greenboost_cli.workflow'.
ignore-vcs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
