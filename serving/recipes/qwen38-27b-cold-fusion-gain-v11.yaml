# Qwen3.8-27B-Cold-Fusion-GAIN-V1.1 (NEO-MAX, MTP-IQ4_XS) , the default again.
#
# Why this and not the quant that FITS
# ------------------------------------
# Qwen3.8-27B-UD-IQ3_XXS is 11.10 GiB and fits this 11.94 GiB card with nothing
# streaming; this one is 15.85 GiB and spills ~6 GiB over PCIe every token. On
# raw decode the small one wins (8.37 vs ~5 tok/s), and that is the reason it
# was made default earlier the same day.
#
# That was the wrong metric, and the owner caught it. What a person waits for
# is a finished ANSWER, not a token. Two things make this model finish sooner
# despite being slower per token:
#
#   1. It carries an MTP draft head. UD-IQ3_XXS has none, so it forfeits
#      speculative decoding entirely , worth ~2x on this box when it engages.
#   2. Its whole training goal is fewer thinking tokens. The model card claims
#      1/10 to 1/2 of stock Qwen, and this repo already recorded the same
#      effect for the 3.6 Cold-Fusion generation: "the reduced-thinking-block
#      claim held in the direction that matters for agentic work: tokens per
#      TASK, not tok/s."
#
# Halve the tokens a task needs and 5 tok/s beats 8.37 outright. That is the
# bet this recipe makes, and it is a bet , see "not yet measured" below.
#
# ctx 24576, chosen against the real prompt floor
# -----------------------------------------------
# This box's system prompt plus MCP tool schemas measure ~13,000 tokens per
# request even after the schema degradation and count cap. Sized against that:
#
#     ctx 16384   reserve 1547 MB   spill 5.42 GiB   room  +3,384  (under one file read)
#     ctx 24576   reserve 2227 MB   spill 6.09 GiB   room +11,576
#
# The extra 8k of context costs only 0.67 GiB more spill, because with 15.85 GiB
# of weights the overflow is dominated by weights, not KV. Room wins.
#
# NOT YET MEASURED , do this before quoting a speed-per-task number:
#   a like-for-like A/B against Qwen3.8-27B-UD-IQ3_XXS on ONE identical agentic
#   prompt, comparing wall-clock to a COMPLETE answer and total completion
#   tokens. Comparing tok/s between these two models is exactly the mistake
#   this file exists to correct.
#
# Sampling is the model card's Qwen3.8 thinking-mode set.
# mtpDraftN 4 is this repo's own swept optimum (2->5.15, 3->5.58, 4->6.5, 6->4.40).
#
# kvCache q4_0 — measured 2026-08-20, and NOT for the reason you would guess
# -------------------------------------------------------------------------
# It is not a memory decision. The shim-measured KV+SSM footprint
# (/var/lib/greenboost/synapse/kv_measurements.json, real cudaMalloc
# interception) is 218 MB at ctx 24576 for f16, q8_0 AND q4_0 alike — 48 of
# this model's 65 blocks are Gated DeltaNet whose recurrent state does not
# depend on --cache-type-k/v at all. Quantizing the KV frees nothing.
#
# It is a kernel-selection decision. At a fixed 14,549-token prompt, n=5 per
# leg, f16 run first AND last as a drift control:
#
#     f16   4.74 tok/s  (4.66-4.89)   prefill 786 ms
#     q8_0  2.69        (2.60-2.69)   prefill 1095 ms   <- WORSE than f16
#     q4_0  7.18        (7.17-7.18)   prefill  511 ms   <- 1.48x
#     f16   4.89        (4.88-5.03)   prefill 751 ms    (control, reproduced)
#
# Non-monotonic, which is why nobody guessed it: q8_0 is a 1.8x REGRESSION.
# Working theory is llama.cpp flash-attention kernel coverage — head_dim 256
# is unusual and quantized-KV FA kernels are chosen per type and head_dim.
# Untested; the measurement does not rest on it. Do NOT generalize this to
# other models, which is why it is pinned here and not in _pick_kv_type().
#
# The effect is INVISIBLE at short prompts — at 71-73 tokens f16 spans
# 4.0-7.4 tok/s and kv_type does nothing measurable, which is the shape
# gb_bench_spec sends. This box's real requests carry ~13k tokens of system
# prompt and MCP schemas, so the long-prompt number is the relevant one.
# End-to-end on a 15-query NIAH: 135 s at q4_0 vs 570 s at f16.
#
# Gate evidence, as CLAUDE.md's "never below fp8 without gate evidence"
# requires — q4_0 KV is below fp8:
#   * niah_certify 20000 tokens / 15 needles (the gb_aviary city-list cap):
#     15/15 for q4_0 AND 15/15 for f16. Read that honestly: the strongest
#     gate available cannot SEPARATE them. It is not proof of losslessness.
#   * smoke_gate: PASS for both, byte-identical greedy output at temp 0.
#     (That gate had to be fixed first — it was failing a correct 6-token
#     answer against an 8-token floor, for f16 and q4_0 alike. See
#     gb_aviary.smoke_gate's docstring.)
#
# Revert to f16 if long-context retrieval ever degrades in real use: the
# certification gate is saturated at this haystack size and would not catch
# a subtle loss. `GB_SYNAPSE_KV=f16` pins it for one run without editing.
#
