[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gb-synapse-torch-engine"
version = "0.0.6.post1"
description = "GreenBoost's torch-core inference engine (vendored gLLM, see NOTICE)"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
dependencies = [
    "torch==2.11.0",
    "torchvision==0.26.0",
    "transformers==5.5.4",
    # PyPI's "sgl-kernel" is frozen at 0.3.21 and never loads against torch
    # 2.11/CUDA 13 (undefined symbol at import time, every build variant
    # tried). The project renamed its distribution to "sglang_kernel"
    # starting at v0.4.x (same `sgl_kernel` import name, no code changes
    # needed) — install from the dedicated CUDA-13 wheel index instead of
    # this package name:
    #   pip install "sglang_kernel==0.4.5+cu130" \
    #     --extra-index-url https://sgl-project.github.io/whl/cu130
    # Not expressed as a normal dependency line here because pip's default
    # resolver won't follow --extra-index-url from a dependency list alone.
    # See NOTICE for the API-surface changes this version jump required
    # (gllm/_custom_ops.py, gllm/layers/sampler.py).
    "flashinfer-python==0.6.12",
    "flashinfer-cubin==0.6.12",
    "fastapi[standard]>=0.115.0",
    "pydantic>=2.11.7",
    "openai>=1.99.1",
    "pyzmq",
    "aiohttp",
    "numpy",
    "tqdm",
    "einops",
    "pillow",
    "av",
    "datasets",
    "gptqmodel==7.2.0",     # pinned DOWN from unconstrained-latest (7.3.2) , that
                            # version's models/definitions/solar_open2.py imports
                            # transformers.masking_utils.create_recurrent_attention_mask,
                            # absent from the pinned transformers==5.5.4 (confirmed:
                            # neither solar_open2.py nor any reference to it exists in
                            # 7.2.0's source). GPTQ and AWQ's linear methods share this
                            # one lazy top-level import in gptqmodel/models/auto.py, so
                            # ANY packed-int quantize call crashed at import time before
                            # this pin, not just SolarOpen2 usage.
    "autoawq",
    "compressed-tensors",
    "accelerate",           # third_party/auto_round's real, direct dep (was only
                            # transitively present via transformers/gptqmodel/autoawq
                            # before , declared explicitly so a future upstream
                            # version bump there can't silently drop it)
    "py-cpuinfo",           # third_party/auto_round/auto_round/utils/device.py does
                            # a hard top-level `import cpuinfo` , not optional/lazy
    "scipy",                # third_party/turboquant's core.py/cache.py/cuda_kernels.py
                            # use scipy.stats.norm (Lloyd-Max Gaussian quantizer)
    # Pinned DOWN from pip's unconstrained latest — live bring-up (2026-07-16,
    # RTX 5070 sm120) found both of these break `import gllm` at the versions
    # pip resolves by default, before any model even loads. See
    # synapse_engine/NOTICE for the full incident notes.
    "kernels==0.14.1",              # transformers==5.5.4's hub_kernels calls
                                    # LayerRepository(repo_id=, layer_name=)
                                    # with no revision/version — kernels>=0.15
                                    # made one of those two required, raising
                                    # ValueError at transformers import time.
    "nvidia-cutlass-dsl==4.5.0",     # sgl-kernel==0.3.21's bundled
                                    # flash_attn_origin.cute module calls
                                    # nvvm.RoundingModeKind, which doesn't
                                    # exist in nvidia-cutlass-dsl 4.6.x's MLIR
                                    # bindings (flashinfer-python's own floor
                                    # is only ">=4.5.0", so pip picks 4.6.1
                                    # unless pinned down explicitly).
]

[project.optional-dependencies]
bnb = ["bitsandbytes"]

[tool.setuptools]
py-modules = ["logger"]

[tool.setuptools.packages.find]
include = ["gllm*"]

[tool.setuptools.package-data]
gllm = ["layers/moe/fused_moe_triton/configs/*.json"]
