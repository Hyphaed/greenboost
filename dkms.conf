PACKAGE_NAME="greenboost"
PACKAGE_VERSION="2.8.1"

BUILT_MODULE_NAME[0]="greenboost"
BUILT_MODULE_LOCATION[0]="."
DEST_MODULE_LOCATION[0]="/updates/dkms"

# Optimization flags are set via ccflags-y in the Kbuild file.
# MAKE and CLEAN are intentionally omitted: DKMS 3.x supplies the correct
# default:  make -C ${kernel_source_dir} M=${build_dir} modules
# Using DKMS's built-in default ensures M= always points to the DKMS build
# directory regardless of the caller's working directory.

AUTOINSTALL="yes"
