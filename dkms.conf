PACKAGE_NAME="greenboost"
PACKAGE_VERSION="3.2"

BUILT_MODULE_NAME[0]="greenboost"
BUILT_MODULE_LOCATION[0]="."
DEST_MODULE_LOCATION[0]="/updates/dkms"

# Optimization flags are set via ccflags-y in the Kbuild file.
#
# Clang-built kernel detection: CachyOS, Gentoo/clang, and some Arch-based
# distros compile the kernel with clang.  On these systems `make` without
# LLVM=1 invokes GCC, which rejects clang-specific flags (e.g. -mretpoline-
# external-thunk, -mstack-alignment=8) and fails with -Werror.
# LLVM=1 selects the full LLVM toolchain (CC=clang, LD=ld.lld, etc.) to
# match the toolchain used to build the running kernel.
_gb_llvm=""
if [ -f "${kernel_source_dir}/.config" ]; then
    grep -qs '^CONFIG_CC_IS_CLANG=y' "${kernel_source_dir}/.config" 2>/dev/null \
        && _gb_llvm="LLVM=1"
fi
#
# ${build_dir} is NOT a dkms-provided variable here: dkms declares it
# `local -r` inside build() only, so it's in scope when `dkms build` sources
# this file but NOT when `dkms autoinstall` does (autoinstall sources this
# conf at module-scope first, to check AUTOINSTALL, before build() runs; that
# read caches by mtime/path and build() never re-sources it). Result: under
# autoinstall MAKE[0] silently got `M=` (empty), so make built the kernel
# tree itself instead of an external module and died on
# arch/x86/tools/cpufeaturemasks.awk. Derive our own path instead of relying
# on dkms's internal variable.
_gb_build_dir="${dkms_tree:-/var/lib/dkms}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build"
MAKE[0]="make -C ${kernel_source_dir} M=${_gb_build_dir} ${_gb_llvm} modules"
CLEAN="make -C ${kernel_source_dir} M=${_gb_build_dir} ${_gb_llvm} clean"

AUTOINSTALL="yes"
