{{- if and .Values.greenboost.enable .Values.serviceAccount.create }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "greenboost-dra-driver.serviceAccountName" . }}
  namespace: {{ include "greenboost-dra-driver.namespace" . }}
  labels:
    {{- include "greenboost-dra-driver.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
