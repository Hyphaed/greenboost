{{- if .Values.deviceClass.enabled }}
---
# Default ResourceClaimTemplate for GreenBoost extended VRAM.
# Pods reference this template to request 1 unit of greenboost.nvidia.com VRAM.
apiVersion: resource.k8s.io/v1
kind: ResourceClaimTemplate
metadata:
  name: greenboost-vram-pool
  namespace: {{ include "greenboost-dra-driver.namespace" . }}
  labels:
    {{- include "greenboost-dra-driver.labels" . | nindent 4 }}
spec:
  spec:
    devices:
      requests:
      - name: vram
        deviceClassName: greenboost.nvidia.com
        allocationMode: ExactCount
        count: 1
{{- end }}
