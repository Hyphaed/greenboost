# evals/semantics/core.yaml — GB-Semantics eval set.
#
# Ground truth is pinned to tests/fixtures/semantics/events.py's fixture
# scenario (a single frozen snapshot of Fable-Fusion-27B serving on a 12 GB
# RTX 5070, mid-generation, with a deliberate Rule #1 violation baked in —
# see that file's docstring). tests/test_semantics_evals.py loads the
# fixture into an isolated dataflux log per test and runs every entry below
# against the REAL gb_semantics engine — no mocking of resolve()/
# evaluate_segment()/answer() themselves.
#
# `kind: metric` entries with `source: fixture` assert an EXACT value (the
# resolver reads only the injected fixture events, so the outcome is
# deterministic on any machine). `source: live` entries only assert the
# resolver runs without raising and returns a well-formed dict — those
# resolvers read the ACTUAL box's kernel module / free RAM / running
# servers, which legitimately differs machine to machine; check_semantics_
# coverage.py plus these structural checks jointly guard against a renamed/
# missing resolver, which is the regression class this suite exists to catch.
#
# `category: trap` entries additionally carry `trap_raw_field` — the field a
# naive, ungoverned answer would read instead, and `trap_raw_wrong: true`
# asserting that field's fixture value, read alone, gives the WRONG verdict.
# The test runner tallies these as GreenBoost's own before/after number, the
# local analogue of Anthropic's 21% -> 95%.

# ── metrics, fixture-exact ───────────────────────────────────────────────
- id: vram_fill_pct_reads_physical_not_virtual
  kind: metric
  name: vram_fill_pct
  source: fixture
  category: trap
  question: "Is Rule #1 (90% VRAM) satisfied right now?"
  expect: {value: 42.3, threshold_state: below_target}
  trap_raw_field: fb_used_pct
  trap_raw_value: 97.0
  trap_raw_wrong: true
  trap_why: >
    fb_used_pct=97.0 (virtual, shim-inflated) reads as "essentially full" /
    Rule #1 satisfied. The real physical figure is 42.3% — Rule #1 is being
    VIOLATED. Reading the raw field alone reports the opposite of the truth.

- id: t2_pressure_fraction_exact
  kind: metric
  name: t2_pressure_fraction
  source: fixture
  category: trap
  question: "What's the current T2 DDR pressure (continuous)?"
  expect: {value: 0.72, threshold_state: warn}
  trap_raw_field: t2_pressure_level_thresholds
  trap_raw_wrong: true
  trap_why: >
    0.72 read against the ENUM scale's thresholds (warn_at=1, critical_at=2)
    would misclassify as "nominal" (0.72 < 1) when the fraction scale's own
    thresholds (warn_at=0.6) correctly call this "warn". Same field name,
    two incompatible scales — the exact collision t2_pressure_level's
    never_use entry documents.

