# ── decode latency shape (2026-08-20) ────────────────────────────────────
- id: inter_token_p95_ms_exact
  kind: metric
  name: inter_token_p95_ms
  source: fixture
  category: trap
  question: "How does decode actually feel , is output smooth?"
  expect: {value: 190.0}
  trap_raw_field: tok_s
  trap_raw_value: 5.2
  trap_raw_wrong: true
  trap_why: >
    tok_s=5.2 reads as "a steady 5.2 tokens a second", i.e. a token every
    ~192 ms, evenly. The real distribution in the same event is bimodal: a
    2 ms median inside each accepted draft batch and a 190 ms p95 at the
    forward-pass boundary. The mean describes no token that actually
    happened, and the boundary is the part a user feels.

- id: slow_token_ratio_exact
  kind: metric
  name: slow_token_ratio
  source: fixture
  expect: {value: 0.25, threshold_state: warn}
  question: "What share of tokens land in the slow tail?"

