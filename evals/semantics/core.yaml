# ── gaming lifecycle (2026-08-20) ────────────────────────────────────────
- id: gaming_session_orphans_survives_a_newer_event_without_the_field
  kind: metric
  name: gaming_session_orphans
  source: fixture
  category: trap
  question: "Did the last stop leave any game processes running?"
  expect: {value: 0, threshold_state: ok}
  trap_raw_field: pids_kill
  trap_raw_value: 3
  trap_raw_wrong: true
  trap_why: >
    pids_kill=3 reads as "three processes had to be force-killed, something
    went wrong". It did not: force-killing a process that ignores SIGTERM is
    a successful stop. orphans=0 is the field that says everything actually
    died. The fixture also places a NEWER gaming_session event that carries
    no orphans field at all, so a resolver reading the newest event of the
    kind reports "no data" while the answer is one event back.

