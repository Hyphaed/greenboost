# semantics/segments.yaml , GB-Semantics named canonical filters.
#
# Anthropic's finding this file exists to act on: hand-rolled population
# filters (their "active users" example) are the single biggest source of
# wrong answers, because an agent re-derives the filter logic slightly
# differently every time it's asked. Every segment below returns
# {matched: bool, evidence: [...]} , the evidence list is what makes a
# verdict checkable rather than a bare claim.
#
# `swap_thrash_not_gpu_throttle` and `kmod_missing_silent_degrade` are two
# real historical misdiagnoses (documented in CLAUDE.md) encoded as
# executable filters , the actual point of this file.

- name: rule1_underfilled
  doc: >
    Rule #1 violation: physical VRAM sits well below the 85-92% target band
    while overflow to T2/T3 is active , the RULE #1 TRIPWIRE per
    CLAUDE.md's own definition ("a shim_transition must fire when VRAM is
    under-filled while overflow to T2/T3 is active").
  evaluator: rule1_underfilled
  reads: [vram_fill_pct, t2_pressure_fraction, t3_spill_active_mb]
  severity: violation

- name: weights_on_t3
  doc: Model weights (not KV) resident on T3 NVMe , the Placement Floor rule this repo's own quantize_to_fit() refuses to allow.
  evaluator: weights_on_t3
  reads: [t3_spill_active_mb]
  severity: violation

- name: feeder_idle_while_host_saturated
  doc: A connected feeder shows near-zero item throughput while the host node is at/above its VRAM fill target , the Cluster rule's own tripwire ("a connected feeder sitting idle while the host is the bottleneck is a rule violation").
  evaluator: feeder_idle_while_host_saturated
  # 2026-07-30: corrected to match what the evaluator actually calls
  # (resolve("vram_fill_pct", entity_id="host") , this segment is
  # deliberately HOST-scoped, not cluster-wide; see cluster_vram_fill_pct
  # for the cluster-wide equivalent metric).
  reads: [vram_fill_pct, feeder_items]
  severity: violation

- name: below_quality_floor
  doc: Currently-served model's effective_bits is below the fp8 floor without a surfaced tradeoff , CLAUDE.md's Quality Floor rule.
  evaluator: below_quality_floor
  reads: [meets_fp8_floor, effective_bits]
  severity: warning

- name: swap_thrash_not_gpu_throttle
  doc: >
    High OS swap usage + high iowait, WHILE something in the logs suggests
    "GPU thermal throttling". This segment exists because that exact
    misread happened for real (2026-07-09: 8GB swap, 90% iowait, generation
    stalled 6+ min, initially blamed on GPU thermal throttling until real
    telemetry was pulled). Matching this segment means: the bottleneck is
    host memory/disk, not the GPU , don't recommend a GPU-side fix.
  evaluator: swap_thrash_not_gpu_throttle
  reads: [swap_pressure, iowait_pct]
  severity: diagnosis

- name: vram_headroom_exhausted
  doc: >
    VRAM is filled PAST the Rule #1 target, into the 10% reserve that exists
    so an allocation spike has somewhere to go. The exact mirror of
    `rule1_underfilled`, and a blind spot for as long as that segment existed:
    the tripwire only ever watched the low side, so a card at 84.9% raised a
    `violation` while the same card at 97.9% (254 MB free of 12227) raised
    nothing at all. Matched means: reduce what is resident , a shorter ctx, a
    smaller quant, or a second process to stop , and do NOT read a
    high number as excellent utilisation. Returns matched: None when fill
    cannot be read; an unknown card is never a healthy card.
  evaluator: vram_headroom_exhausted
  reads: [vram_headroom_pct, vram_fill_pct]
  severity: warning

- name: kmod_version_drift
  doc: >
    A newer GreenBoost core is installed on disk than the kernel module
    currently running , `core_build_version` (the installer's build stamp)
    and `kmod_loaded_version` (`/sys/module/greenboost/version`) disagree.
    Installing core does NOT swap the running module; the old one stays
    resident until something reloads it, so every fix in the new build is
    silently absent while every version banner still looks plausible. Matched
    means: reload the module (`sudo greenboost load`), do NOT reinstall and
    do NOT treat this as being out of date , the bytes are already on disk.
    Returns matched: None when either side is unknown (module not loaded, or
    no build stamp) , "cannot tell" is never "no drift".
  evaluator: kmod_version_drift
  reads: [core_build_version, kmod_loaded_version, kmod_loaded]
  severity: diagnosis

- name: kmod_missing_silent_degrade
  doc: >
    greenboost.ko is not loaded (kmod_loaded=false) but the shim/logs still
    describe normal operation , the silent-degrade failure mode where "spill
    to T2" has no real kernel-backed reservation and falls back to ordinary
    OS swap while looking like a generic slowdown. Matching this segment
    means: stop, don't diagnose further, the fix is `sudo greenboost load`.
  evaluator: kmod_missing_silent_degrade
  reads: [kmod_loaded, shim_fresh]
  severity: violation

- name: prompt_cache_cold
  doc: prompt_cache_hit_pct is near zero across recent serve requests despite --cache-reuse/--cache-ram being active , usually an unstable prefix (system prompt or tool schema changed between turns).
  evaluator: prompt_cache_cold
  reads: [prompt_cache_hit_pct]
  severity: warning

- name: serve_healthy
  doc: The positive case , no other segment matches, shim is fresh and kmod is loaded, and the current serve session is within its VRAM target band at/above the quality floor. The "everything's fine" verdict is itself governed so an agent doesn't have to synthesize it from silence. Fixed 2026-07-30 to also account for the idle case , no recent decode activity means the VRAM/freshness/quality-floor gates don't apply, healthy iff kmod is loaded.
  evaluator: serve_healthy
  reads: [kmod_loaded, shim_fresh, vram_fill_pct, meets_fp8_floor]
  severity: ok

- name: feeder_unreachable
  doc: >
    A configured feeder did not answer the fabric probe or SSH fallback ,
    distinct from feeder_idle_while_host_saturated, which assumes the feeder
    IS connected and only checks whether it's doing work. An unreachable
    feeder gives zero work-item signal to explain why it's idle, so without
    this segment an agent reading only feeder_idle_while_host_saturated
    (matched: false because there's no throughput data at all) could
    wrongly conclude the cluster has no problem.
  evaluator: feeder_unreachable
  reads: [feeder_reachable]
  severity: violation

- name: gaming_inference_contention
  doc: >
    A game session is active (per greenboost_gaming's gaming_session
    dataflux events) WHILE T2 DDR pressure from AI inference is genuinely
    elevated , the coexistence conflict `gaming_mode`'s VRAM-eviction
    reprioritization exists to reduce but can't eliminate, since GreenBoost
    is a single-virtual-GPU design (both workloads share the same physical
    VRAM/T2 pool). Matching this segment means: the game's frame-time
    stutter or the inference session's latency (or both) may be explained
    by real resource contention, not a bug in either subsystem alone.
  evaluator: gaming_inference_contention
  reads: [gaming_session_active, t2_pressure_fraction]
  severity: diagnosis

- name: weights_dont_fit_vram
  doc: >
    The served model's weights alone exceed physical VRAM, so whatever does
    not fit crosses PCIe on every forward pass and caps decode regardless of
    tuning. A capacity FACT, not a fault , the fix is a model/quant/ctx
    choice, and Rule #1 is not being violated (the tiering layer is doing
    exactly its job). Exists because nothing in the governed layer said this
    out loud: measured 2026-08-18, 15.86 GB of weights against 12227 MiB of
    VRAM at 2.7-3.5 tok/s, arithmetic that predicts the measurement almost
    exactly, while the operator was shown five n=3 tok_s_drop advisories
    instead.
  evaluator: weights_dont_fit_vram
  reads: [weights_gb, vram_fill_pct]
  severity: diagnosis

- name: pcie_link_degraded_under_load
  doc: >
    The PCIe link is below its ceiling WHILE the GPU is genuinely busy , the
    only condition under which a gen comparison means anything, since an idle
    card downtrains its link by design. Returns matched=None (cannot tell)
    rather than false when the GPU is idle or utilization is unreadable.
    Distinct from the `pcie_degraded` dataflux event, which samples once at
    telemetry init and produced 13 false positives on this box.
  evaluator: pcie_link_degraded_under_load
  reads: [pcie_link_gen_current]
  severity: warning

- name: idle_serve_holding_vram
  doc: >
    A serve session is holding a significant share of the card while doing no
    work. NOT a fault , keeping weights resident is exactly why the next
    request is fast, and usually the right trade. It is a finding only when the
    operator wants the card back (a game, a training run, a different model)
    and has nothing telling them the memory is reclaimable without losing the
    conversation. Actionable: `gb synapse pause <model>` saves the KV state and
    returns the VRAM; `resume` restores it (measured 740 ms save / 537 ms
    restore for 54,377 tokens).
  evaluator: idle_serve_holding_vram
  reads: [idle_vram_held_gb, vram_fill_pct]
  severity: diagnosis

- name: prefill_dominated_by_replay
  doc: >
    Most of the turn's prefill was re-running work the engine had already done.
    An architecture FACT, not a fault: llama.cpp cannot resume a recurrent layer
    mid-prefix, which is also why it refuses `--cache-reuse` for this model and
    says so at startup. Governed because it is the largest recoverable per-turn
    cost on this box and nothing named it , an operator watching a 99.9%
    cache-hit rate has every reason to think prefill is already solved.
    Actionable via sparse prefix checkpointing (arXiv 2605.05219) on top of
    llama.cpp slot save/restore, which does carry recurrent state.
  evaluator: prefill_dominated_by_replay
  reads: [recurrent_replay_ms]
  severity: diagnosis

- name: cloud_inference_in_use
  doc: >
    An inference endpoint points at hardware the owner does not control.
    Severity violation: this is the one rule whose breach invalidates the entire
    stack for that request , every tier, the shim, the kernel module and the
    cluster fabric exist so inference stays local. Returns matched=None (cannot
    tell) rather than false when endpoints cannot be resolved, because silence
    must never read as compliance.
  evaluator: cloud_inference_in_use
  reads: [inference_endpoint_is_local]
  severity: violation

- name: models_wiped_from_manifest
  doc: >
    Weights exist on disk that GB-Synapse cannot serve because the manifest
    does not list them. The operator-visible symptom is `no such model` at CLI
    startup for a model the box fully downloaded. Distinct from "model not
    downloaded", which is a bandwidth problem; this is a bookkeeping problem
    with a seconds-long fix. Returns matched=None when the cache directory
    cannot be read, never false , absence of evidence is not a clean bill.
  evaluator: models_wiped_from_manifest
  reads: [unregistered_cached_models]
  severity: violation

- name: host_oom_imminent
  doc: >
    Host RAM is close enough to exhaustion that the OOM killer is a real risk to
    the running session. Severity violation rather than diagnosis because,
    unlike weights that do not fit, this does not slow the session down , it
    ends it, along with whatever work was in flight. Returns matched=None when
    host memory or the guard state cannot be read; "I cannot see host memory"
    is never reported as "host memory is fine".
  evaluator: host_oom_imminent
  reads: [host_mem_available_gb, t2_oom_guard_state]
  severity: violation

- name: proxy_memory_near_cap
  entity: node
  severity: violation
  doc: >
    The gb-synapse proxy is within 20% of its address-space cap. Past the cap
    the next allocation inside a request raises MemoryError and that request
    dies mid-stream, while the host itself stays healthy , which is why the
    symptom reads as "gb-synapse stopped responding while generating" with
    plenty of free RAM on the box. Returns null, not false, when the proxy is
    not running or has no cap.
  evaluator: proxy_memory_near_cap
  metrics: ["proxy_rss_mb", "proxy_mem_headroom_pct"]
  remediation: >
    Restart the serve to reclaim it now (/llamaserve restart). If it climbs
    again while idle, that is a leak, not load , the proxy logs a gc heap
    census when it crosses 45% of the cap; read it in the proxy log.

- name: agent_compaction_broke_prefix
  entity: node
  severity: violation
  doc: >
    A compaction rewrote the reusable prompt prefix instead of appending to it.
    Expensive rather than incorrect , the answer is still right, it just costs
    a full re-prefill, minutes of wall time at ~5 tok/s. Returns null, not
    false, when no compaction has happened yet.
  evaluator: agent_compaction_broke_prefix
  metrics: ["agent_compaction_prefix_kept_pct"]
  remediation: >
    Compact by APPENDING a summary and dropping a suffix region, leaving the
    system prompt, tool schemas and pinned block byte-identical. Check
    prompt_cache hit_pct across the compaction: a drop is the proof.

- name: kv_prefetch_has_no_target
  entity: node
  severity: diagnosis
  doc: >
    There is no T2-resident KV, so lookahead KV prefetch has nothing to
    prefetch. This is the gate on that whole branch, and true is a legitimate
    branch-ending answer rather than a fault: on this box the T2 spill is
    weights, and KV fits T1 at every context length actually served. Null when
    the shim is not reporting , "nobody measured" must stay distinguishable
    from "measured, and there is nothing there".
  evaluator: kv_prefetch_has_no_target
  metrics: ["kv_t2_resident_mb", "kv_prefetch_opportunities"]
  remediation: >
    Nothing to fix. If you want the branch re-evaluated at a longer context,
    serve with a ctx above the reserve figure from
    gb_synapse.kv_spill_reachability() and GREENBOOST_KV_PREFETCH=stats (it
    measures only, moves no bytes), then read kv_prefetch_opportunities.

- name: bandwidth_bound_harvestable
  entity: node
  severity: advisory
  doc: >
    The card is holding power it cannot use: weights are streaming from T2,
    GPU utilisation is low because the pass is waiting on the link, and the
    board still draws near its limit. Throughput is exactly what PCIe allows
    and nothing is broken , the watts are simply being spent waiting, and the
    control loop can give them back without moving tok/s. Null when the power
    or overflow reading is missing; "the sensors did not answer" is not "there
    is nothing to harvest".
  evaluator: bandwidth_bound_harvestable
  metrics: ["t2_overflow_active_mb", "tuner_harvesting"]
  remediation: >
    Run `tuner_tick()` to see the decision and its reasoning; apply it with
    tuner_tick(apply=True, confirm=True) under GB_ORCH_ACTUATE=1. The loop
    verifies after a settle window and restores the lever if throughput moved.

- name: ctx_estimate_undercounts
  entity: node
  severity: warning
  doc: >
    The CLI is predicting smaller requests than the server actually charges, so
    its budget checks report headroom that is not there and a turn can be
    assembled that the server then rejects. Only the under-count direction
    matches , over-estimating merely compacts early. Returns null, not false,
    before any turn has been graded against a real usage.prompt_tokens.
  evaluator: ctx_estimate_undercounts
  metrics: ["ctx_estimate_error_pct", "ctx_hard_trims"]
  remediation: >
    The estimator self-corrects from the next completed turn (it learns
    chars-per-token from usage.prompt_tokens). If it stays negative, the
    request carries content the estimate cannot see , check that every
    injected block (recalled memory, pinned plan, RAG) reaches
    estimate_request_tokens().

- name: agent_hallucinating_tool_names
  entity: node
  severity: warning
  doc: >
    The model is naming tools the registry does not have, above a few percent.
    That is schema misalignment, not bad luck. Returns null when no tool call
    has been observed.
  evaluator: agent_hallucinating_tool_names
  metrics: ["agent_hallucinated_tool_pct"]
  remediation: >
    Align the offered schema to the names the model reaches for rather than
    instructing it harder , PATool's finding is to fit the schema to the
    model, not the model to the schema.

- name: agent_eval_below_reference
  entity: node
  severity: diagnosis
  doc: >
    The harness scores below where MCP-Bench puts a 27B-class model (0.582 for
    gemma-3-27b-it). With comparable weights that points at the harness rather
    than the model. Returns null until a benchmark has actually been run.
  evaluator: agent_eval_below_reference
  metrics: ["agent_eval_overall"]
  remediation: >
    Run greenboost_cli.bench.agent_eval twice and confirm the runs agree before
    reading anything into the number , a benchmark that cannot reproduce itself
    cannot measure a 5% change.

- name: gaming_mode_stuck
  doc: >
    greenboost.ko's `gaming_mode` is still 1 while no Wine/Proton game is
    running , the state a hard-killed game session leaves behind. Every
    inference T2 buffer stays parked at the eviction queue's tail until
    something clears it, so weights are evicted ahead of gaming buffers that
    no longer exist. Nothing reported this before; it looked like a generic
    slowdown. Returns `matched: null` when the flag or /proc cannot be read
    , "cannot tell" is never reported as healthy.
  evaluator: gaming_mode_stuck
  reads: [gaming_mode_active, gaming_session_orphans]
  severity: warning

- name: decode_tail_heavy
  doc: >
    Decode is dominated by a slow TAIL rather than a slow average , at least
    10% of tokens sit above twice the response's own median gap. The
    distinction decides the fix: a uniformly slow decode is a bandwidth or
    placement problem, a heavy tail with a healthy median is a stall (draft
    batch boundary, slot eviction, or something else competing for the box).
    Reading mean tok/s alone cannot tell the two apart. Returns
    `matched: null` when no streamed sample carries percentiles.
  evaluator: decode_tail_heavy
  reads: [inter_token_p95_ms, slow_token_ratio]
  severity: warning

- name: kmod_stale_from_initramfs
  doc: >
    Version drift that a reload will NOT durably fix, because the stale module
    is coming out of the initramfs on every boot. Kept separate from
    `kmod_version_drift` because the two carry different instructions and
    handing out the wrong one costs a reboot to discover: plain drift is fixed
    by `sudo greenboost load`; this one is fixed for exactly one boot by that
    same command, and durably only by keeping the module out of the boot image
    (`sudo update-initramfs -u -k all` with initramfs/zz-greenboost-exclude
    installed). Incident 2026-08-21: v3.2 booted across several reboots while
    v3.4 was the installed build, and T3 failed open every time because /var
    was not mounted that early. Returns matched: None when either input is
    unknown , "cannot tell" is never "no drift".
  evaluator: kmod_stale_from_initramfs
  reads: [kmod_load_stage, kmod_loaded_version, core_build_version]
  severity: violation

- name: t3_configured_but_disabled
  doc: >
    Tier 3 has a configured cap and is not actually open. The failure this
    names is not "T3 is off" , it is that everything an operator would check
    says T3 is fine: the status page prints the 73 GB cap, `t3_total_mb`
    reports 74752, and the only place the truth appears is one kernel log line
    at module init. Matched means no byte will reach T3 for this boot,
    whatever the capacity readouts say. Usual cause is the module loading
    before /var is mounted , check `kmod_load_stage`.
  evaluator: t3_configured_but_disabled
  reads: [t3_enabled, t3_capacity_configured_mb]
  severity: violation

- name: apparmor_contaminated_by_greenboost
  doc: >
    GreenBoost rules are sitting past a snapd profile's closing brace. Matched
    means snapd.apparmor.service is already failing and every snap on the
    machine is one apparmor_parser run away from refusing to launch. The trap
    this encodes: `grep libgreenboost_audit <profile>` returning a hit reads
    like "the grant is active" and means the exact opposite , a rule past the
    closing brace grants nothing and invalidates the whole profile, so the
    presence of the string IS the failure signal. That misreading is why the
    same bug shipped twice. Fix:
    `sudo ~/Dev/kernel_inference/diagnostics/fix-boot-issues.sh --apply`, or
    `greenboost apparmor-uninstall` on an installed machine.
  evaluator: apparmor_contaminated_by_greenboost
  reads: [apparmor_profiles_contaminated]
  severity: violation

- name: proton_tool_race
  doc: >
    Two different GreenBoost Proton compat tools started the same game at
    once. Measured 2026-08-21: greenboost-proton-experimental at 02:57:48 and
    greenboost-proton at 02:57:50, each delegating to a different upstream
    Proton, both into wine prefix compatdata/2909400. One prefix cannot be
    brought up twice; each run's explorer.exe appeared, the game never did,
    and both were force-killed about a minute later. Steam's CompatToolMapping
    named only ONE of the two, so this is invisible in Steam's own UI and
    needs the wrapper logs to see at all. Fix: keep one GreenBoost Proton tool
    mapped per game, and restart Steam after changing a mapping , Steam holds
    config.vdf in memory and will not re-read it mid-session.
  evaluator: proton_tool_race
  reads: [game_launch_attempts, proton_tools_installed]
  severity: violation

- name: game_launch_retry_loop
  doc: >
    Repeated wrapper starts with no game process , a launch that is looping
    rather than loading. Three or more starts inside the window with nothing
    running means something kills the game and Steam retries. A spinner cannot
    tell this from a slow first run, which is exactly how it presented on
    2026-08-21: four minutes that looked like progress and were not.
  evaluator: game_launch_retry_loop
  reads: [game_launch_attempts, game_process_running]
  severity: violation

- name: launch_made_only_wine_infrastructure
  doc: >
    Proton came up and the game did not. wine's own helpers (explorer.exe,
    services.exe, wineboot) start for every launch whether or not the title
    does, so counting any .exe as "the game is running" reports a dead launch
    as a live one. Matched precisely when the only wine processes present are
    Proton's own.
  evaluator: launch_made_only_wine_infrastructure
  reads: [game_process_running]
  severity: warning
