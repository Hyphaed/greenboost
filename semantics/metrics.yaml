# semantics/metrics.yaml , GB-Semantics governed metric registry.
#
# One name per concept. Every `resolver` names a `_res_<resolver>()` function
# in gb_semantics.py; `checks/check_semantics_coverage.py` fails the build if
# the function doesn't exist, if a `source_fields` entry doesn't exist on the
# named class, or if a `never_use` field has been renamed/removed upstream.
#
# `threshold.derive` values are ALWAYS %-of-live-topology, per this repo's
# hardcoded-hardware-values rule , never a literal GB/MB figure. Where a
# concrete number appears below it is a REFERENCE observation for the eval
# fixtures (Phase 6), not a threshold.
#
# Reference workload for every synapse-group metric's eval fixture (per
# CLAUDE.md's Reference Workload Rule): DavidAU/Qwen3.6-27B-Fable-Fusion-711-
# Uncensored-Heretic-NM-DAU-NEO-MAX-MTP-GGUF (`MTP-Q4_K_M`, dense 27B, hybrid
# attention: 16 x (3x Gated DeltaNet -> 1x Gated Attention), so
# n_kv_layers = ceil(n_layers/4), NOT n_layers) on a single 12 GB RTX 5070
# host. That 12 GB figure is real hardware on THIS box, still read live via
# NVML at runtime by every resolver below , it is written here only so a
# human maintaining this file knows which box the reference numbers came from.

- name: vram_fill_pct
  entity: gpu
  unit: percent
  doc: >
    Real physical VRAM occupancy , THE Rule #1 signal ("fill every GPU to
    ~90%"). Prefers the dataflux flight recorder's `snapshot.fb_phys_used_pct`
    (matches gb_telemetry.GpuMetrics exactly); falls back to
    gb_monitor.snapshot()'s NVML-sourced used/total (also physical, just
    without the T2/T3 pressure context) when no recent snapshot event exists.
  resolver: vram_fill_pct
  source_fields: ["gb_dataflux.snapshot.fb_phys_used_pct", "gb_monitor.GbSnapshot.gpu_mem_used_mb", "gb_monitor.GbSnapshot.vram_physical_mb"]
  source_tier: measured
  direction: target_band
  threshold: {target_band: [85, 92], derive: pct_of_physical_vram}
  owner: GB-Tiering
  never_use:
    - field: fb_used_pct
      why: >
        Virtual , shim-inflated with T2+T3+feeder bytes so Ollama/gb-synapse
        see one big device (Cluster Compute Architecture). Reading this for
        a Rule #1 check reports "full" while physical VRAM sits half-empty;
        this is the exact trap in the 2026-07-12 incident this rule's own
        text describes (17.5GB to T2, `vram_headroom_mb=244` while ~8GB
        physically free).
  aliases: [vram_used_pct, gpu_memory_pct, fill_pct, rule1_pct]

- name: t2_pressure_level
  entity: pool
  unit: enum_0_1_2
  doc: >
    T2 DDR pressure as the KERNEL POOL reports it (ok=0 / warn=1 /
    critical=2). Two different fields in this codebase are both named
    "t2_pressure" at two different scales , this metric pins down which one.
  resolver: t2_pressure_level
  source_fields: ["gb_monitor.GbSnapshot.t2_pressure", "gb_dataflux.snapshot.t2_pressure"]
  source_tier: measured
  direction: lower_is_better
  threshold: {warn_at: 1, critical_at: 2}
  owner: GB-Tiering
  never_use:
    - field: gb_dataflux.snapshot.t2_pressure (as a 0..1 float)
      why: >
        `SnapshotRecorder` also writes a continuous 0.0-1.0 pressure fraction
        under the SAME key name in the `snapshot` event body , comparing it
        against the enum's 0/1/2 thresholds silently misclassifies "elevated"
        as "nominal". This metric's resolver reads the pool's own enum field,
        never the continuous one; use `t2_pressure_fraction` (below) for the
        continuous view.
  aliases: [t2_pressure, ddr_pressure]

- name: t2_overflow_active_mb
  entity: pool
  unit: megabytes
  doc: >
    Bytes the shim has actually routed to T2 DDR , "is overflow happening right
    now". Distinct from t2_pressure_fraction, which is how full the T2 POOL is:
    on a large pool the two diverge completely (measured 2026-08-17:
    t2_overflow_total_mb=14326 into a 43 GB pool reading pressure 0.0). This is
    the signal the Rule #1 tripwire needs , see rule1_underfilled.
  resolver: t2_overflow_active_mb
  source_fields:
    - shim_stats.t2_overflow_total_mb
  source_tier: measured
  direction: lower_is_better
  owner: GB-Tiering
  aliases:
    - t2_overflow_mb
  never_use:
    - field: t2_pressure
      why: >
        Pool FULLNESS, not overflow. A large pool reads low pressure while
        substantial overflow is in progress, which is exactly how the Rule #1
        tripwire was silenced on 2026-08-17 (14326 MB overflowing a 43 GB pool
        at pressure 0.0, VRAM at 69%).
    - field: t2_allocated_mb
      why: >
        The kmod's own allocation counter read 0 in the same sample where the
        shim reported 14326 MB of live T2 overflow, so it does not track what
        the shim actually routed.

- name: t2_pressure_fraction
  entity: pool
  unit: fraction_0_1
  doc: The continuous 0.0-1.0 T2 pressure SnapshotRecorder trends over time (distinct scale from t2_pressure_level , see that metric's never_use).
  resolver: t2_pressure_fraction
  source_fields: ["gb_dataflux.snapshot.t2_pressure"]
  source_tier: measured
  direction: lower_is_better
  threshold: {warn_at: 0.6, critical_at: 0.9}
  owner: GB-Tiering
  aliases: [t2_fraction]

- name: t3_spill_active_mb
  entity: pool
  unit: megabytes
  doc: >
    NVMe (T3) bytes currently holding WEIGHTS (not KV). Nonzero here during
    active inference is a Placement Floor violation , weights must never
    live on T3 (quantize_to_fit refuses this by design).
  resolver: t3_spill_active_mb
  source_fields: ["gb_monitor.GbSnapshot.t3_used_mb", "gb_dataflux.snapshot.t3_used_mb"]
  source_tier: measured
  direction: zero_is_healthy
  threshold: {critical_above: 0}
  owner: GB-Tiering
  aliases: [t3_used_mb, weights_on_disk]

- name: kv_resident_share
  entity: pool
  unit: fraction_0_1
  doc: Share of the model's total KV cache currently resident in T1 VRAM vs spilled to T2. Low share under active generation = the Memory Orchestration rule's "KV must be placed and kept in T1 first" is not holding.
  resolver: kv_resident_share
  source_fields: ["gb_monitor.GbSnapshot.kv_used_mb", "gb_dataflux.snapshot.kv_used_mb", "gb_dataflux.snapshot.kv_t2_mb"]
  source_tier: derived
  direction: higher_is_better
  threshold: {warn_below: 0.5}
  owner: GB-Tiering

- name: effective_bits
  entity: model
  unit: bits
  doc: The bit-width a model checkpoint was ACTUALLY quantized/served at, from gb-quant's own decision log , not the nominal quant name in its filename (a Q4_K_M file can still be served bf16-escalated on OOM fallback).
  resolver: effective_bits
  source_fields: ["gb_dataflux.kernel_backend.bits", "gb_dataflux.quantize.bits"]
  source_tier: measured
  direction: informational
  owner: GB-Quant

- name: meets_fp8_floor
  entity: model
  unit: boolean
  doc: >
    Whether effective_bits satisfies the quality floor (fp8/16/bf16/fp16
    qualify; anything below needs an explicit surfaced tradeoff , see
    CLAUDE.md's Quality Floor rule). This is a SEGMENT-shaped question
    answered as a metric because it's asked standalone constantly; see
    `below_quality_floor` in segments.yaml for the evidence-bearing form.
  resolver: meets_fp8_floor
  source_fields: ["effective_bits"]
  source_tier: derived
  direction: higher_is_better
  owner: GB-Quant

- name: kv_bits_by_layer
  entity: model
  unit: bits_per_layer_map
  doc: >
    Per-layer K/V TurboQuant bit assignment. Governed because this
    reference workload is a HYBRID architecture (16 x (3x Gated DeltaNet ->
    1x Gated Attention)): only 1 layer in `full_attention_interval` carries a
    real, growing KV cache , the other 3 hold a fixed-size recurrent state.
    `n_kv_layers` (ModelEntry, gb_synapse.py:465) is the field that already
    encodes this; treating `n_layers` as the KV layer count is the exact bug
    that clamped this model to ctx=2048 before the 2026-07-27 fix.
  resolver: kv_bits_by_layer
  source_fields: ["gb_synapse.ModelEntry.n_kv_layers", "gb_dataflux.turboquant_activate.k_bits", "gb_dataflux.turboquant_activate.v_bits"]
  source_tier: measured
  direction: informational
  owner: GB-Quant
  never_use:
    - field: gb_synapse.ModelEntry.n_layers (as the KV layer count)
      why: "Overcounts KV cache ~4x on this hybrid architecture (real incident: clamped ctx to 2048 before the full_attention_interval fix, see CLAUDE.md 2026-07-27)."

- name: quant_rel_error
  entity: model
  unit: fraction
  doc: >
    gb_quant.plan_quality()'s MEASURED mean/max relative error for the
    per-layer bit-assignment it actually chose for this model -- the real
    answer to "did quantizing to the target bit width cost meaningful
    accuracy", per CLAUDE.md's own quality-floor culture ("Quality must be
    held by MEASUREMENT, not assumption... when proxy and measurement
    disagree, trust the measurement"). Governed because the nominal target
    bit-width alone is a proxy, not the answer: plan_quality() can silently
    bf16-escalate individual layers above the target (see bf16_kept_layers
    in this metric's own resolved value) to hold the error_ceiling, so
    neither "what bit-width did I ask for" nor "what bit-width does the
    filename say" tells you the actual measured error -- only this does.
  resolver: quant_rel_error
  source_fields: ["dataflux.quant_plan.mean_rel_err", "dataflux.quant_plan.max_rel_err"]
  source_tier: measured
  direction: informational
  owner: GB-Quant
  never_use:
    - field: a bit-width or model-card claim (e.g. "Q4_K_M", "int4") read as the actual achieved error
      why: "A quant token or checkpoint name is a proxy for quality, not a measurement of it -- plan_quality()'s own per-layer bf16 escalation means the same nominal bit-width can carry very different real error across two models. Only quant_plan's measured mean_rel_err/max_rel_err answer the actual question."

- name: ssm_state_gb
  entity: model
  unit: gigabytes
  doc: >
    Selective-SSM (Mamba/Mamba2/hybrid Gated-DeltaNet) recurrent-state
    footprint — the counterpart to kv_bits_by_layer for the layers
    n_kv_layers EXCLUDES. Per arXiv:2312.00752 (the Mamba paper) this is
    CONSTANT in context length, unlike KV cache: it must be added once
    alongside weights, never scaled by ctx. Governed because before the
    2026-07-29 fix this was silently charged as ZERO everywhere, hitting the
    primary reference workload (Brian6145/Qwen3.6-27B-Claude-Opus-Sonnet-
    Distilled-NVFP4-MTP, a Qwen3.6 hybrid: 3 GDN layers per 1 real-attention
    layer) directly.
  resolver: ssm_state_gb
  source_fields: ["gb_synapse.ModelEntry.n_recurrent_layers", "gb_synapse.ModelEntry.ssm_d_conv", "gb_synapse.ModelEntry.ssm_conv_width", "gb_synapse.ModelEntry.ssm_state_elems"]
  source_tier: derived
  direction: informational
  owner: GB-Synapse
  never_use:
    - field: kv_gb (as covering recurrent-layer memory too)
      why: "kv_gb only accounts for n_kv_layers (real attention). Recurrent layers' state is a SEPARATE fixed cost this metric carries — omitting it undercounts a hybrid model's real VRAM footprint at the exact placement step (_solve_ctx_and_layers/_fit_gpu_layers) that matters."

- name: recurrent_layer_fraction
  entity: model
  unit: fraction
  doc: >
    n_recurrent_layers / n_layers. 0.0 for a plain transformer, 1.0 for a
    pure-Mamba/Mamba2 architecture (is_recurrent_only=true — n_kv_layers==0
    is then the CORRECT count, not "unknown"), the hybrid ratio in between
    (0.75 for the primary reference workload's 3-GDN-to-1-attention mix).
  resolver: recurrent_layer_fraction
  source_fields: ["gb_synapse.ModelEntry.n_recurrent_layers", "gb_synapse.ModelEntry.n_layers"]
  source_tier: derived
  direction: informational
  owner: GB-Synapse
  never_use:
    - field: "gb_synapse.ModelEntry.n_kv_layers == 0 (treated as \"unknown, assume every layer is real attention\")"
      why: "Correct for an is_recurrent_only architecture (a pure Mamba/Mamba2 model genuinely has zero real-attention layers) — treating 0 as a metadata gap and falling back to n_layers reintroduces the exact ~4x KV overestimate the full_attention_interval fix (2026-07-27) closed, just for a different architecture family."

- name: tok_s_decode
  entity: serve_session
  unit: tokens_per_second
  doc: Client-OBSERVED decode throughput (gb_synapse.record_measured_tok_s(), fed from real GB-CLI turns) , never a synapse_recommend() estimate, which is a pre-serve fit projection, not a measurement.
  resolver: tok_s_decode
  source_fields: ["gb_dataflux.tok_s_measured.tok_s"]
  source_tier: measured
  direction: higher_is_better
  owner: GB-Synapse
  never_use:
    - field: synapse_recommend()'s fit-report estimate
      why: "A pre-serve projection based on VRAM fit math, not an observed rate. CLAUDE.md is explicit that measured tok/s beats estimated whenever they disagree."
  aliases: [tok_s, decode_speed, tokens_per_second]

- name: ttft_ms
  entity: serve_session
  unit: milliseconds
  doc: Time-to-first-token for the CURRENT serve session, split by prompt-cache hit vs miss. Governed because it's the metric the new host-memory prompt-cache actuation (Phase 5) exists to move.
  resolver: ttft_ms
  source_fields: ["gb_dataflux.prompt_cache.ttft_ms"]
  source_tier: measured
  direction: lower_is_better
  owner: GB-Synapse

- name: engine_prefill_ms
  entity: serve_session
  unit: milliseconds
  doc: >-
    The ENGINE's own prefill duration (llama-server's `timings.prompt_ms`), as
    opposed to ttft_ms, which is measured by the proxy from request arrival to
    first content token and therefore also contains queueing behind another
    slot, proxy overhead, and any unrelated load on the box. Read the two
    together: ttft_ms minus engine_prefill_ms is everything that was not
    prefill. Recording only ttft_ms made a slow first token unattributable ,
    on 2026-08-18 a 68.3 s ttft_ms was measured that had a 32-thread kernel
    build running concurrently, and no field existed to separate "prefill is
    slow" from "the box was busy".
  resolver: engine_prefill_ms
  source_fields: ["gb_dataflux.prompt_cache.engine_prompt_ms"]
  source_tier: measured
  direction: lower_is_better
  owner: GB-Synapse
  never_use:
    - field: gb_dataflux.prompt_cache.ttft_ms
      why: >
        Not interchangeable with this metric. ttft_ms is measured by the proxy
        from request arrival to first content token, so it also contains
        queueing behind another slot, proxy overhead and unrelated load on the
        box. Quoting it as "prefill time" is how a 68.3 s first token got
        attributed to the model on 2026-08-18 when a 32-thread kernel build
        was running concurrently. Use ttft_ms for what the client waited, this
        for what prefill cost, and their difference for everything else.

- name: prompt_depth_tokens
  entity: serve_session
  unit: count
  doc: >-
    Total prompt length of the most recent request, i.e. how deep the
    conversation is. Prefill cost grows with this even at a near-perfect cache
    hit rate, which a hit_pct alone cannot show: measured across one session,
    ttft went 5.4 s at 13.8k reused tokens to 34.2 s at 18.5k, both at 96-99%
    hit_pct. Any TTFT or tok/s figure quoted without the depth it was measured
    at is not comparable to another.
  resolver: prompt_depth_tokens
  source_fields: ["gb_dataflux.prompt_cache.prompt_tokens"]
  source_tier: measured
  direction: neutral
  owner: GB-Synapse

- name: prompt_cache_hit_pct
  entity: serve_session
  unit: percent
  doc: Share of requests whose prompt prefix was served from llama.cpp's `--cache-reuse`/`--cache-ram` host-memory cache rather than recomputed. Requires a stable token prefix (system prompt + tool schema); see the `prompt_cache_cold` segment for the failure mode.
  resolver: prompt_cache_hit_pct
  source_fields: ["gb_dataflux.prompt_cache.hit_pct"]
  source_tier: measured
  direction: higher_is_better
  owner: GB-Synapse

- name: slot_pin_rate_pct
  entity: serve_session
  unit: percent
  doc: >
    GB-1. Share of recent chat requests that were routed back to the engine
    slot already holding that conversation's KV (`decision` = pinned or
    pinned-edited), as opposed to being assigned a slot for the first time or
    displacing another conversation (assigned/reassigned). A long single
    conversation should sit near 100%; a persistently low value on a box with
    one active session means the index is not recognising the conversation
    (identity is the system+tools head plus the first user message), not that
    the engine is misbehaving.
  resolver: slot_pin_rate_pct
  source_fields: ["gb_dataflux.cache_index.decision"]
  source_tier: measured
  direction: higher_is_better
  owner: GB-Synapse
  never_use:
    - field: gb_dataflux.prompt_cache.hit_pct
      why: "Reads as the same question and is not. hit_pct measures how much of ONE request's prefix the engine reused; slot_pin_rate_pct measures whether the request even reached the slot that held that prefix. A conversation evicted from its slot can still show a healthy hit_pct on the shared system-prompt head while having lost every token after it , which is exactly the failure GB-1 exists to catch."

- name: last_edit_chunk
  entity: serve_session
  unit: index
  doc: >
    GB-1. Index of the first content-addressed chunk that changed on the most
    recent chat request (chunk 0 is the system prompt + tool schemas, then one
    chunk per message). `null` means the turn only appended, which is the case
    that must cost nothing. A low index means an edit landed near the front of
    the conversation, and everything after it has to be re-prefilled , the
    measured 4.98x prefill penalty on this box.
  resolver: last_edit_chunk
  source_fields: ["gb_dataflux.cache_index.changed_chunk"]
  source_tier: measured
  direction: informational
  owner: GB-Synapse

- name: served_ctx
  entity: serve_session
  unit: tokens
  doc: >
    The ACTUAL context window this serve session is running at right now.
    Ground truth is the live server (`GET /slots`), then the run-state JSON
    gb_synapse.serve() writes at launch , never a client-side constant.
  resolver: served_ctx
  source_fields: ["llama.cpp /slots", "gb_synapse.ServerState.ctx"]
  source_tier: measured
  direction: informational
  owner: GB-Synapse
  never_use:
    - field: greenboost-cli environment/settings.py gb_synapse_ctx() hardcoded 65536
      why: "Fixed 2026-07-27 , used to return a constant that never asked the server. Every auto-compact threshold in GB-CLI was computed against a number unrelated to reality until this fix landed."

- name: n_gpu_layers_effective
  entity: serve_session
  unit: layer_count
  doc: Layers actually placed on GPU for THIS serve session (the `-ngl` value gb_synapse_backends chose), out of the model's total. Dense-model placement question, distinct from MoE expert-tier placement (`gb_plan`) which does not apply to this reference workload.
  resolver: n_gpu_layers_effective
  source_fields: ["gb_dataflux.synapse_serve", "gb_synapse.ServerState.n_gpu_layers"]
  source_tier: measured
  direction: higher_is_better
  owner: GB-Synapse

- name: cluster_vram_fill_pct
  entity: node
  unit: percent
  doc: vram_fill_pct extended across every node in the cluster (host + online feeders) , the "maximize the WHOLE cluster" rule's own signal, one row per node.
  resolver: cluster_vram_fill_pct
  source_fields: ["gb_cluster.cluster_snapshot"]
  source_tier: measured
  direction: target_band
  threshold: {target_band: [85, 92], derive: pct_of_physical_vram_per_node}
  owner: GB-Cluster

- name: feeder_items
  entity: feeder
  unit: count
  doc: Work items a feeder actually processed in the window (dataflux `items` per node). The tripwire for "feeder holds bytes but runs no kernels" , items:0 while the host is saturated is the rule violation, not an acceptable fallback.
  resolver: feeder_items
  source_fields: ["gb_dataflux.summarize.nodes"]
  source_tier: measured
  direction: higher_is_better
  owner: GB-Cluster

- name: feeder_reachable
  entity: feeder
  unit: boolean
  doc: Whether a configured feeder answered the fabric probe (GB_MSG_FEEDER_STATUS) or SSH fallback just now , distinct from feeder_items, which assumes the feeder IS connected and only asks whether it's doing work. A feeder can be unreachable (network/netd down) with no work-item signal to explain why.
  resolver: feeder_reachable
  source_fields: ["gb_cluster.cluster_snapshot.feeders[].online"]
  source_tier: measured
  direction: higher_is_better
  owner: GB-Cluster

- name: gaming_session_active
  entity: node
  unit: boolean
  doc: Whether the most recent gaming_session dataflux event (emitted by greenboost_gaming/greenboost_proton/proton at game launch/exit, a separate repo) was a "start" not yet followed by a "stop" , the governed signal for "is a game currently running on this box's GPU."
  resolver: gaming_session_active
  source_fields: ["gb_dataflux.gaming_session (latest event)"]
  source_tier: measured
  direction: informational
  owner: GB-Cluster

- name: link_bw_gbps
  entity: link
  unit: gigabits_per_second
  doc: Measured host<->feeder transfer bandwidth from real `link_transfer` events (nbytes/seconds), never a nominal NIC speed.
  resolver: link_bw_gbps
  source_fields: ["gb_dataflux.link_transfer.nbytes", "gb_dataflux.link_transfer.seconds"]
  source_tier: derived
  direction: higher_is_better
  owner: GB-Cluster

- name: swap_pressure
  entity: node
  unit: enum_or_pct
  doc: >
    Host-side OS swap usage + iowait , the signal that gets misread as "GPU
    thermal throttling" (real incident, 2026-07-09: 8GB swap, 90% iowait,
    generation stalled 6+ minutes). Governed specifically so that trap can't
    repeat; see the `swap_thrash_not_gpu_throttle` segment for the full
    evidence bundle.
  resolver: swap_pressure
  source_fields: ["free -h", "vmstat wa column", "gb_monitor.GbSnapshot.swap_pressure"]
  source_tier: measured
  direction: lower_is_better
  owner: Health
  never_use:
    - field: "a log line containing clock_throttled=True, read alone"
      why: "Describes one internal shim signal, not a diagnosis. CLAUDE.md's own standing rule: never diagnose GPU/perf from inference alone; always pull real telemetry first (system_status, nvidia-smi, free/vmstat, lsmod)."

- name: iowait_pct
  entity: node
  unit: percent
  doc: CPU iowait percentage (vmstat `wa` column) , the other half of the swap_pressure evidence bundle.
  resolver: iowait_pct
  source_fields: ["vmstat wa column"]
  source_tier: measured
  direction: lower_is_better
  threshold: {warn_above: 20, critical_above: 50}
  owner: Health

- name: kmod_loaded
  entity: node
  unit: boolean
  doc: >
    Whether greenboost.ko is actually loaded right now (`lsmod | grep
    greenboost`), NOT whether it was installed. Real incident: a fresh
    reinstall does not reload the kernel module automatically, so "spill to
    T2" silently degrades into ordinary OS swap while every log line still
    says "GreenBoost active".
  resolver: kmod_loaded
  source_fields: ["lsmod", "/dev/greenboost"]
  source_tier: measured
  direction: higher_is_better
  owner: Health

- name: shim_fresh
  entity: node
  unit: boolean
  doc: Whether /run/greenboost/shim_stats was written within the last 30s , the freshness gate every resolver in this file that reads a "live" field must also honor.
  resolver: shim_fresh
  source_fields: ["/run/greenboost/shim_stats mtime"]
  source_tier: measured
  direction: higher_is_better
  owner: Health

- name: weights_gb
  entity: serve_session
  unit: gigabytes
  doc: >
    Weight footprint of the model currently being served, from the manifest
    entry matched against the live run-state's model+quant. Governed because
    "do the weights even fit?" is the first question a slow-decode
    investigation should ask and nothing answered it before: on 2026-08-18 a
    15.86 GB model on a 12227 MiB card decoded at 2.7-3.5 tok/s, and the only
    thing the layer offered was five tok_s_drop advisories pointing at a KV
    lever. Pairs with `weights_dont_fit_vram`.
  resolver: weights_gb
  source_fields: ["gb_synapse.ModelEntry.n_bytes"]
  source_tier: measured
  direction: informational
  owner: GB-Synapse

- name: pcie_link_gen_current
  entity: gpu
  unit: pcie_generation
  doc: >
    PCIe generation the link is negotiated at RIGHT NOW, read live from
    nvidia-smi, plus the ceiling and the GPU utilization in the same sample so
    a reading can be interpreted without a second call. Deliberately not
    GpuTopology.pcie_gen_current, which is probed once at NVML init.
  resolver: pcie_link_gen_current
  source_fields: []
  source_tier: measured
  direction: informational
  owner: GB-Tiering
  never_use:
    - field: pcie_gen_current
      why: >
        GpuTopology samples the link ONCE at telemetry init and caches it for
        the process lifetime. A GPU downtrains its link to Gen1/Gen2 whenever
        it is idle and only retrains under load, so the cached value answers
        "what was the link doing at startup", which is almost never the
        question. Reading it produced 13 false `pcie_degraded` events on this
        box (2026-08-18, all claiming gen2 while the link measures Gen4 x16
        under real load).

- name: idle_vram_held_gb
  entity: gpu
  unit: gigabytes
  doc: >
    VRAM held by a serve session while the GPU is doing no work (utilization
    below the busy threshold). Zero when the GPU is busy , this measures DEAD
    residency, not residency. Governed because it is the number an operator
    actually reacts to and nothing reported it: measured 2026-08-18, 10.4 GiB
    of a 12 GB card allocated at 0% utilization, 787 MHz, 23 W, with no signal
    anywhere saying that memory was reclaimable. Pairs with the
    `idle_serve_holding_vram` segment and `gb synapse pause`.
  resolver: idle_vram_held_gb
  source_fields: []
  source_tier: measured
  direction: lower_is_better
  owner: GB-Synapse

- name: recurrent_replay_ms
  entity: serve_session
  unit: milliseconds
  doc: >
    Estimated per-turn cost of re-running the recurrent layers over the WHOLE
    prompt. This architecture is hybrid , 17 attention layers and 48 Gated
    DeltaNet recurrent layers , and a recurrent layer's state at position t only
    exists by running every token up to t, so the KV cache can hit 99.9% and the
    recurrent stack still replays the entire conversation. Measured 2026-08-18
    over 29 warm turns: median 6,937 ms prefill for a median of 42 new tokens,
    cost per TOTAL token stable at 0.151 ms while cost per NEW token scattered
    146-191. DERIVED, not read , the engine reports one prompt_ms with no
    breakdown; new tokens are charged at this box's cold-prefill rate and the
    remainder attributed to replay. The largest recoverable per-turn cost here.
  resolver: recurrent_replay_ms
  source_fields: ["gb_dataflux.prompt_cache.engine_prompt_ms"]
  source_tier: derived
  direction: lower_is_better
  owner: GB-Synapse

- name: inference_endpoint_is_local
  entity: serve_session
  unit: boolean
  doc: >
    True when every configured inference endpoint is on hardware the owner
    controls , loopback, this box, or a feeder on the owner's own LAN. The
    executable half of CLAUDE.md's Local-First Must-Rule: GreenBoost exists so a
    27B model runs on a 12 GB card instead of being rented by the token, so a
    cloud endpoint does not merely leak data, it makes the whole stack pointless
    for that request. A prose rule cannot notice a config drifting; this resolves
    the actual serve binds and inference base-url environment variables in play.
    A LAN feeder counts as local , the cluster fabric is the point of the
    project, not an escape from it.
  resolver: inference_endpoint_is_local
  source_fields: []
  source_tier: measured
  direction: informational
  owner: GB-Synapse

- name: unregistered_cached_models
  entity: node
  unit: count
  doc: >
    Models whose weights are on disk in the HuggingFace cache but absent from
    GB-Synapse's manifest , downloaded, paid for in bandwidth and disk, and
    invisible to `gb`. Governed because this failure presents to the operator
    as `no such model: <name>` at CLI startup with no hint that the weights are
    right there: it happened three times on 2026-08-18 (a Full Install purge
    resets the manifest but leaves `_hf_cache` untouched) and twice left the
    CLI unable to start at all. Nonzero means `gb_synapse.recover_from_hf_cache()`
    has work to do; it re-registers from GGUF headers and downloads nothing.
  resolver: unregistered_cached_models
  source_fields: ["gb_synapse._load_manifest", "MODEL_STORE_DIR/_hf_cache"]
  source_tier: measured
  direction: lower_is_better
  owner: GB-Synapse
  never_use:
    - field: "len(gb_synapse.list_models())"
      class: incomplete_population
      why: >
        The manifest count alone cannot reveal this: a wiped manifest reports a
        perfectly consistent small number and nothing marks it as wrong. Only
        comparing it against what is on disk shows the gap.

- name: host_mem_available_gb
  entity: node
  unit: gigabytes
  doc: >
    Host MemAvailable , the kernel's own estimate of what a new allocation can
    actually obtain, and the number that decides whether the OOM killer runs.
    Governed because GreenBoost's T2 pool competes for exactly this pool and
    nothing in the layer watched it: on 2026-08-18 the OOM killer took the
    user's terminal twice (27.0 GB and 31.7 GB anon RSS) and the only warning
    existed in dmesg.
  resolver: host_mem_available_gb
  source_fields: ["/proc/meminfo MemAvailable"]
  source_tier: measured
  direction: higher_is_better
  owner: GB-Tiering
  never_use:
    - field: "MemFree"
      class: misleading_proxy
      why: >
        MemFree excludes reclaimable page cache, so it reads alarmingly low on a
        healthy box and says nothing about what an allocation would get. The
        kmod's own guard compares against MemAvailable; so must this.

- name: t2_oom_guard_state
  entity: node
  unit: state
  doc: >
    The kernel T2 OOM guard's verdict, from sysfs pool_brief's PRESSURE field.
    greenboost.ko trips it when host MemAvailable falls under its reserve and
    begins evicting T2. It fired twice on 2026-08-18, ~10 minutes before each
    OOM kill, and announced it only to the kernel log.
  resolver: t2_oom_guard_state
  source_fields: ["/sys/class/greenboost/greenboost/pool_brief"]
  source_tier: measured
  direction: informational
  owner: GB-Tiering
  never_use:
    - field: "dmesg 'T2 OOM guard TRIPPED'"
      class: log_only_signal
      why: >
        The kernel log is not a queryable surface: it is not in dataflux, it is
        not in this layer, and nothing alerts on it. It carried the only advance
        warning of both 2026-08-18 OOM kills and nobody saw either one.

- name: proxy_rss_mb
  entity: node
  unit: megabytes
  doc: >
    Resident memory of the gb-synapse proxy process (gb_synapse_api.py). The
    proxy is long-lived and runs under an RLIMIT_AS cap, so its own footprint
    is an operational number, not an implementation detail: on 2026-08-19 an
    unbounded read_events() memo grew it at ~10.7 MB/s while completely idle
    until requests began failing with MemoryError mid-generation.
  resolver: proxy_rss_mb
  source_fields: ["/proc/<pid>/status VmRSS"]
  source_tier: measured
  direction: lower_is_better
  owner: GB-Synapse

- name: proxy_mem_headroom_pct
  entity: node
  unit: percent
  doc: >
    Share of the gb-synapse proxy's address-space cap (RLIMIT_AS) still unused.
    This is the number that predicts "gb-synapse stopped responding while
    generating": the cap converts a runaway allocation into a MemoryError in
    one request instead of an OOM kill of the whole session, so the box stays
    healthy while requests fail, and host-level memory metrics look fine.
    Resolves to null , never to 100 , when the proxy is not running or carries
    no cap.
  resolver: proxy_mem_headroom_pct
  source_fields: ["/proc/<pid>/status VmRSS", "/proc/<pid>/limits Max address space"]
  source_tier: measured
  direction: higher_is_better
  owner: GB-Synapse
  never_use:
    - field: mem_available_mb
      class: wrong_scope
      why: >
        Host MemAvailable answers whether the OOM killer will run, not whether
        the proxy can allocate. They disagree exactly when it matters: on
        2026-08-19 the box had 32 GB available while the proxy was raising
        MemoryError on every request against a 6.15 GiB cap.

- name: agent_eval_overall
  entity: node
  unit: score
  doc: >
    greenboost-cli's own agent benchmark score, 0-1 (AE-1). The number every
    other agent-evolution claim is checked against: MCP-Bench puts
    gemma-3-27b-it at 0.582 and qwen3-30b-a3b at 0.627 against gpt-5 at 0.749,
    so a local 27B is roughly 80% of frontier on tool use and harness quality,
    not model choice, is the dominant term.
  resolver: agent_eval_overall
  source_fields: ["agent_eval_run.overall"]
  source_tier: measured
  direction: higher_is_better
  owner: GB-CLI
  never_use:
    - field: overall
      class: unit_ambiguous
      why: >
        The raw score is meaningless without the model that produced it. The
        same harness scores differently per checkpoint, so comparing an
        `overall` across models reads a harness change into what is really a
        model change. The governed metric carries the model in its raw_source.

- name: agent_hallucinated_tool_pct
  entity: node
  unit: percent
  doc: >
    Share of tool calls naming a tool the registry does not have (AE-5).
    PATool's result is that small models fail tool use by schema misalignment,
    emitting names learned in pretraining rather than the names offered. This
    repo saw it live: the model emitted a fully-prefixed MCP name against a
    registry that only knew the bare one.
  resolver: agent_hallucinated_tool_pct
  source_fields: ["agent_tool_schema_miss.outcome"]
  source_tier: measured
  direction: lower_is_better
  owner: GB-CLI

- name: agent_compaction_prefix_kept_pct
  entity: node
  unit: percent
  doc: >
    Share of compactions that preserved the engine's reusable prompt prefix
    (AE-2). Dataflux has recorded a 97.9% prompt-cache hit on a 64k window
    here; a compaction that rewrites the prefix throws that away and re-prefills
    from scratch, which at ~5 tok/s is minutes of wall time per event.
  resolver: agent_compaction_prefix_kept_pct
  source_fields: ["agent_context_edit.extended_prior", "agent_context_edit.head_kept"]
  source_tier: measured
  direction: higher_is_better
  owner: GB-CLI
  never_use:
    - field: middle_compacted
      class: wrong_scope
      why: >
        It counts how many messages were summarised, which reads like the
        saving and says nothing about the cost. A compaction can summarise a
        great many messages and still be a loss if it moved the prefix.
        extended_prior and head_kept are the fields that answer that.

- name: agent_memory_recall_chars
  entity: node
  unit: characters
  doc: >
    Characters of recalled memory injected into the last turn (AE-9/10).
    Recall that grows without bound is memory crowding out the conversation it
    was supposed to serve, which on a small local window is a direct loss of
    working context.
  resolver: agent_memory_recall_chars
  source_fields: ["agent_memory_recall.chars"]
  source_tier: measured
  direction: lower_is_better
  owner: GB-CLI
